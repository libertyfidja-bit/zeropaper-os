<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroPaper OS — Clinical Consultation & Pharmacy Dispatch</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; }
    .tabs { display: flex; gap: 12px; }
    .tab-btn { background: var(--panel); color: var(--muted); border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .tab-btn.active { background: var(--blue); color: white; border-color: var(--blue); }
    .view-container { display: none; }
    .view-container.active { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
    input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: white; font-size: 14px; }
    textarea { height: 100px; resize: vertical; }
    .btn { background: var(--accent); color: #052e16; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 20px; font-size: 15px; }
    .rx-card { background: rgba(59, 130, 246, 0.1); border: 1px solid var(--blue); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
    .rx-card h4 { color: #93c5fd; margin-bottom: 6px; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>ZeroPaper Clinical & Pharmacy Gateway</h1>
      <p style="color: var(--muted); font-size: 14px;">Electronic Health Records & Zero-Paper Prescription Dispatch</p>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchView('doctor', this)">Doctor Consultation</button>
      <button class="tab-btn" onclick="switchView('pharmacy', this)">Pharmacy Dispatch</button>
      <a href="/api/v1/export-esg-csv" style="background: var(--accent); color: #052e16; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 14px; display: flex; align-items: center;">📥 Download ESG CSV Report</a>
    </div>
  </div>

  <!-- View 1: Doctor Consultation -->
  <div id="doctorView" class="view-container active">
    <div class="panel">
      <h3>Select Waiting Patient Ticket</h3>
      <label>Active Patients in Queue</label>
      <select id="ticketSelect" size="10" style="height: 280px; margin-top: 8px;" onchange="loadSelectedPatient(this)">
        <option value="">Loading queue...</option>
      </select>
    </div>

    <div class="panel">
      <h3>Electronic Consultation & Prescription</h3>
      <label>Active Ticket Number</label>
      <input type="text" id="activeTicket" readonly style="background: #090d16;" />

      <label>Clinical Diagnosis</label>
      <textarea id="diagInput" placeholder="Enter clinical diagnosis and notes..."></textarea>

      <label>Electronic Medication Prescription</label>
      <textarea id="rxInput" placeholder="e.g., Amoxicillin 500mg - 1 tab 3x daily for 7 days"></textarea>

      <label>Lab / Diagnostic Orders</label>
      <input type="text" id="labInput" placeholder="e.g., Malaria RDT, Complete Blood Count" />

      <button class="btn" onclick="submitPrescription()">Transmit Digital Rx to Pharmacy</button>
    </div>
  </div>

  <!-- View 2: Pharmacy Dispatch -->
  <div id="pharmacyView" class="view-container">
    <div class="panel" style="grid-column: span 2;">
      <h3>Pending Electronic Prescriptions (Pharmacy Queue)</h3>
      <div id="pharmacyQueueList" style="margin-top: 16px;">Loading pharmacy queue...</div>
    </div>
  </div>

  <script>
    function switchView(viewName, btn) {
      document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      if (viewName === 'doctor') {
        document.getElementById('doctorView').classList.add('active');
        fetchWaitingTickets();
      } else {
        document.getElementById('pharmacyView').classList.add('active');
        fetchPharmacyQueue();
      }
    }

    async function fetchWaitingTickets() {
      const res = await fetch('/api/v1/clinical/waiting-tickets');
      const tickets = await res.json();
      const select = document.getElementById('ticketSelect');
      select.innerHTML = tickets.map(t => `<option value="${t.ticket_number}">[${t.ticket_number}] ${t.full_name} — ${t.department}</option>`).join('') || '<option value="">No patients waiting.</option>';
    }

    function loadSelectedPatient(select) {
      document.getElementById('activeTicket').value = select.value;
    }

    async function submitPrescription() {
      const ticket = document.getElementById('activeTicket').value;
      if (!ticket) { alert('Please select a patient ticket first.'); return; }

      const payload = {
        ticket_number: ticket,
        diagnosis: document.getElementById('diagInput').value,
        prescription: document.getElementById('rxInput').value,
        lab_notes: document.getElementById('labInput').value
      };

      const res = await fetch('/api/v1/clinical/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      alert(result.message);
      document.getElementById('diagInput').value = '';
      document.getElementById('rxInput').value = '';
      document.getElementById('labInput').value = '';
      document.getElementById('activeTicket').value = '';
      fetchWaitingTickets();
    }

    async function fetchPharmacyQueue() {
      const res = await fetch('/api/v1/pharmacy/pending');
      const records = await res.json();
      const container = document.getElementById('pharmacyQueueList');

      container.innerHTML = records.map(r => `
        <div class="rx-card">
          <h4>Ticket: ${r.ticket_number}</h4>
          <p><strong>Diagnosis:</strong> ${r.diagnosis}</p>
          <p><strong>Prescription:</strong> ${r.prescription}</p>
          <p><strong>Lab Orders:</strong> ${r.lab_notes}</p>
          <button class="btn" style="width: auto; padding: 8px 16px; margin-top: 10px;" onclick="dispenseMedication(${r.id})">Mark Dispensed (Zero Paper)</button>
        </div>
      `).join('') || '<p style="color: var(--muted);">No pending prescriptions in pharmacy queue.</p>';
    }

    async function dispenseMedication(recordId) {
      await fetch('/api/v1/pharmacy/dispense', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ record_id: recordId })
      });
      fetchPharmacyQueue();
    }

    fetchWaitingTickets();
  </script>
</body>
</html>
