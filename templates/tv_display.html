<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroPaper OS — Waiting Room Live Queue & Eco-Impact TV</title>
  <style>
    :root {
      --bg: #020617;
      --card: #0f172a;
      --border: #1e293b;
      --accent: #10b981;
      --blue: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; padding: 28px; overflow: hidden; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 2px solid var(--border); }
    .voice-controls { display: flex; gap: 12px; align-items: center; }
    select, button { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button.active { background: var(--accent); color: #052e16; border-color: var(--accent); }
    .tv-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 28px; flex: 1; margin-top: 24px; }
    .now-serving-box { background: linear-gradient(145deg, #0f172a, #064e3b); border: 3px solid var(--accent); border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px; position: relative; transition: transform 0.3s; }
    .now-serving-box.flash { animation: pulseFlash 1.2s ease-in-out 3; }
    @keyframes pulseFlash {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(16, 185, 129, 0); }
      50% { transform: scale(1.02); box-shadow: 0 0 60px rgba(16, 185, 129, 0.6); }
    }
    .label-up { font-size: 22px; text-transform: uppercase; letter-spacing: 3px; color: #6ee7b7; font-weight: 700; }
    .giant-ticket { font-size: 135px; font-weight: 900; line-height: 1.05; color: #ffffff; margin: 16px 0; letter-spacing: 2px; }
    .dept-banner { font-size: 34px; font-weight: 700; color: #93c5fd; background: rgba(15, 23, 42, 0.75); padding: 12px 32px; border-radius: 12px; border: 1px solid var(--blue); }
    .patient-sub { margin-top: 18px; font-size: 22px; color: var(--muted); }
    .right-col { display: flex; flex-direction: column; gap: 20px; }
    .queue-panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; flex: 1; }
    .up-next-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); font-size: 22px; }
    .up-next-ticket { font-weight: 800; color: var(--blue); font-size: 26px; }
    .eco-footer { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; background: rgba(16, 185, 129, 0.08); border: 1px solid var(--accent); border-radius: 16px; padding: 20px; text-align: center; }
    .eco-stat h3 { font-size: 32px; color: var(--accent); font-weight: 800; }
    .eco-stat span { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div>
      <h1 style="font-size: 28px;">ZeroPaper Health — Live Patient Queue Display</h1>
      <p id="facilityTag" style="color: var(--muted); font-size: 15px;">100% Paperless Check-In & Triage System</p>
    </div>
    <div class="voice-controls">
      <select id="voiceLang">
        <option value="en-US">Voice: English</option>
        <option value="fr-FR">Voix: Français</option>
        <option value="rw-RW">Ijwi: Ikinyarwanda</option>
      </select>
      <button id="audioToggleBtn" class="active" onclick="enableAudio()">🔊 Voice Announcements: ON</button>
    </div>
  </div>

  <div class="tv-grid">
    <!-- Left: Giant Now Serving Display -->
    <div id="servingCard" class="now-serving-box">
      <span class="label-up">Now Serving Ticket</span>
      <div id="currentTicket" class="giant-ticket">---</div>
      <div id="currentDept" class="dept-banner">Waiting for Next Call...</div>
      <div id="currentPatient" class="patient-sub">Please have your NFC Card or Digital Pass ready</div>
    </div>

    <!-- Right: Up Next Queue + Live ESG Sustainability Counter -->
    <div class="right-col">
      <div class="queue-panel">
        <h2 style="font-size: 22px; color: var(--muted); text-transform: uppercase; margin-bottom: 12px;">Up Next in Waiting Area</h2>
        <div id="upNextList"></div>
      </div>

      <div class="eco-footer">
        <div class="eco-stat">
          <h3 id="tvSheets">0</h3>
          <span>Paper Sheets Saved</span>
        </div>
        <div class="eco-stat">
          <h3 id="tvTrees">0.000</h3>
          <span>Trees Preserved</span>
        </div>
        <div class="eco-stat">
          <h3 id="tvCo2">0.0 kg</h3>
          <span>CO2 Prevented</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let lastAnnouncedTicket = null;
    let audioEnabled = true;

    function enableAudio() {
      audioEnabled = !audioEnabled;
      const btn = document.getElementById("audioToggleBtn");
      btn.innerText = audioEnabled ? "🔊 Voice Announcements: ON" : "🔇 Voice Announcements: MUTED";
      btn.className = audioEnabled ? "active" : "";
      if (audioEnabled) playHospitalChime();
    }

    // Synthesizes a clean 2-tone airport/hospital chime using Web Audio API (no MP3 file needed)
    function playHospitalChime() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const playTone = (freq, start, duration) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
        gain.gain.setValueAtTime(0.25, ctx.currentTime + start);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + start + duration);
      };
      playTone(587.33, 0.0, 0.45); // D5
      playTone(880.00, 0.4, 0.70); // A5
    }

    function speakTicketAnnouncement(ticket, department) {
      if (!audioEnabled || !("speechSynthesis" in window)) return;
      playHospitalChime();

      setTimeout(() => {
        const lang = document.getElementById("voiceLang").value;
        const readableTicket = ticket.replace("-", " ");
        let text = `Ticket number ${readableTicket}, please proceed to ${department}.`;

        if (lang === "fr-FR") {
          text = `Numéro de ticket ${readableTicket}, veuillez vous présenter au service ${department}.`;
        } else if (lang === "rw-RW") {
          text = `Nomero ya tike ${readableTicket}, mwakomereza muri serivisi ya ${department}.`;
        }

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang === "rw-RW" ? "fr-FR" : lang;
        utterance.rate = 0.92;
        window.speechSynthesis.speak(utterance);
      }, 900);
    }

    async function pollTvStatus() {
      try {
        const res = await fetch("/api/v1/tv-status");
        const data = await res.json();

        document.getElementById("facilityTag").innerText =
          `Licensed Facility: ${data.license.facility || "Hospital Server"} • Subscription: ${data.license.status}`;

        document.getElementById("tvSheets").innerText = data.metrics.sheets_saved.toLocaleString();
        document.getElementById("tvTrees").innerText = data.metrics.trees_saved.toFixed(3);
        document.getElementById("tvCo2").innerText = data.metrics.co2_kg_saved + " kg";

        if (data.now_serving) {
          const t = data.now_serving.ticket_number;
          const d = data.now_serving.department;
          document.getElementById("currentTicket").innerText = t;
          document.getElementById("currentDept").innerText = d;
          document.getElementById("currentPatient").innerText = data.now_serving.full_name;

          if (t !== lastAnnouncedTicket) {
            lastAnnouncedTicket = t;
            const card = document.getElementById("servingCard");
            card.classList.remove("flash");
            void card.offsetWidth; // Reflow to restart CSS animation
            card.classList.add("flash");
            speakTicketAnnouncement(t, d);
          }
        }

        const nextHtml = data.up_next.map(item => `
          <div class="up-next-item">
            <span class="up-next-ticket">${item.ticket_number}</span>
            <span>${item.department}</span>
            <span style="color: var(--muted); font-size: 16px;">${item.checkin_method}</span>
          </div>
        `).join("") || `<p style="color: var(--muted); margin-top: 20px;">No patients currently waiting.</p>`;
        document.getElementById("upNextList").innerHTML = nextHtml;
      } catch (e) {
        console.error("TV Poll Error:", e);
      }
    }

    pollTvStatus();
    setInterval(pollTvStatus, 3000);
  </script>
</body>
</html>
