<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroPaper OS — Waiting Room TV Display</title>
  <style>
    :root{--bg:#020617;--card:#0f172a;--border:#1e293b;--accent:#10b981;--blue:#3b82f6;--text:#f8fafc;--muted:#94a3b8;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;}
    body{background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;padding:24px;overflow:hidden;}
    .top-bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:2px solid var(--border);}
    .clock{font-size:28px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;}
    .voice-row{display:flex;gap:10px;align-items:center;}
    select,button{background:var(--card);color:var(--text);border:1px solid var(--border);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
    button.on{background:var(--accent);color:#052e16;border-color:var(--accent);}
    .tv-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;flex:1;margin-top:20px;min-height:0;}
    /* Now Serving */
    .now-box{background:linear-gradient(145deg,#0f172a,#064e3b);border:3px solid var(--accent);border-radius:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:36px;position:relative;}
    .now-box.flash{animation:pulse 1.2s ease-in-out 3;}
    @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(16,185,129,0);}50%{transform:scale(1.015);box-shadow:0 0 60px rgba(16,185,129,0.5);}}
    .now-label{font-size:18px;text-transform:uppercase;letter-spacing:3px;color:#6ee7b7;font-weight:700;}
    .giant-ticket{font-size:120px;font-weight:900;line-height:1;color:#fff;margin:12px 0;letter-spacing:2px;}
    .dept-tag{font-size:28px;font-weight:700;color:#93c5fd;background:rgba(15,23,42,0.75);padding:10px 28px;border-radius:10px;border:1px solid var(--blue);}
    .patient-name{margin-top:14px;font-size:19px;color:var(--muted);}
    /* Right column */
    .right-col{display:flex;flex-direction:column;gap:18px;min-height:0;}
    .queue-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;flex:1;overflow:hidden;}
    .queue-box h2{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}
    .up-item{display:flex;justify-content:space-between;align-items:center;padding:13px 10px;border-bottom:1px solid var(--border);}
    .up-ticket{font-weight:800;color:var(--blue);font-size:22px;}
    .up-dept{font-size:14px;color:var(--muted);}
    .up-pay{font-size:11px;padding:2px 7px;border-radius:4px;font-weight:700;}
    .pay-pending{background:rgba(245,158,11,0.2);color:#fcd34d;}
    .pay-paid{background:rgba(16,185,129,0.2);color:#6ee7b7;}
    /* Eco footer */
    .eco-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;background:rgba(16,185,129,0.07);border:1px solid var(--accent);border-radius:14px;padding:16px;text-align:center;}
    .eco-stat h3{font-size:28px;color:var(--accent);font-weight:800;}
    .eco-stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
    .facility-tag{font-size:13px;color:var(--muted);}
  </style>
</head>
<body>

<div class="top-bar">
  <div>
    <h1 style="font-size:22px;">🏥 ZeroPaper Health — Live Queue</h1>
    <div class="facility-tag" id="facilityTag">100% Paperless Hospital Check-In System</div>
  </div>
  <div class="voice-row">
    <div class="clock" id="clockDisplay">00:00:00</div>
    <select id="voiceLang">
      <option value="en-US">🔊 English</option>
      <option value="fr-FR">🔊 Français</option>
      <option value="rw-RW">🔊 Kinyarwanda</option>
    </select>
    <button id="audioBtn" class="on" onclick="toggleAudio()">🔊 Voice: ON</button>
  </div>
</div>

<div class="tv-grid">
  <!-- Left: Now Serving -->
  <div class="now-box" id="nowBox">
    <span class="now-label">Now Serving</span>
    <div class="giant-ticket" id="nowTicket">---</div>
    <div class="dept-tag" id="nowDept">Waiting for next patient call...</div>
    <div class="patient-name" id="nowName">Please hold your NFC Card or ticket ready</div>
  </div>

  <!-- Right: Up next + ECO stats -->
  <div class="right-col">
    <div class="queue-box">
      <h2>Up Next in Waiting Area</h2>
      <div id="upNextList"><p style="color:var(--muted);font-size:14px;">No patients currently waiting.</p></div>
    </div>
    <div class="eco-bar">
      <div class="eco-stat"><h3 id="tvSheets">0</h3><span>Paper Sheets Saved</span></div>
      <div class="eco-stat"><h3 id="tvTrees">0.000</h3><span>Trees Preserved</span></div>
      <div class="eco-stat"><h3 id="tvCo2">0.0 kg</h3><span>CO₂ Prevented</span></div>
    </div>
  </div>
</div>

<script>
  let lastTicket = null;
  let audioEnabled = true;

  // Clock
  function updateClock() {
    const now = new Date();
    document.getElementById('clockDisplay').innerText =
      now.toLocaleTimeString('en-RW', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }
  setInterval(updateClock, 1000);
  updateClock();

  function toggleAudio() {
    audioEnabled = !audioEnabled;
    const btn = document.getElementById('audioBtn');
    btn.innerText = audioEnabled ? '🔊 Voice: ON' : '🔇 Voice: OFF';
    btn.className = audioEnabled ? 'on' : '';
  }

  function playChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const tone = (freq, start, dur) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
        gain.gain.setValueAtTime(0.22, ctx.currentTime + start);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + start + dur);
      };
      tone(587.33, 0.0, 0.45);
      tone(880.00, 0.4, 0.70);
    } catch(e) {}
  }

  function announce(ticket, dept) {
    if (!audioEnabled || !('speechSynthesis' in window)) return;
    playChime();
    setTimeout(() => {
      const lang = document.getElementById('voiceLang').value;
      const readable = ticket.replace('-', ' ');
      let text;
      if (lang === 'fr-FR') text = `Numéro de ticket ${readable}, veuillez vous présenter au service ${dept}.`;
      else if (lang === 'rw-RW') text = `Nomero ya tike ${readable}, mwakomereza muri serivisi ya ${dept}.`;
      else text = `Ticket number ${readable}, please proceed to ${dept}.`;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = lang === 'rw-RW' ? 'fr-FR' : lang;
      utt.rate = 0.9;
      window.speechSynthesis.speak(utt);
    }, 950);
  }

  async function pollTV() {
    try {
      const res = await fetch('/api/v1/tv-status');
      const data = await res.json();

      // Facility + license tag
      if (data.license) {
        document.getElementById('facilityTag').innerText =
          `${data.license.facility || 'Hospital'} · License: ${data.license.status}`;
      }

      // ECO stats
      if (data.metrics) {
        document.getElementById('tvSheets').innerText = (data.metrics.sheets_saved||0).toLocaleString();
        document.getElementById('tvTrees').innerText = (data.metrics.trees_saved||0).toFixed(3);
        document.getElementById('tvCo2').innerText = (data.metrics.co2_kg_saved||0) + ' kg';
      }

      // Now Serving
      if (data.now_serving) {
        const t = data.now_serving.ticket_number;
        const d = data.now_serving.department;
        const n = data.now_serving.full_name || '';
        document.getElementById('nowTicket').innerText = t;
        document.getElementById('nowDept').innerText = d;
        document.getElementById('nowName').innerText = n;
        if (t !== lastTicket) {
          lastTicket = t;
          const box = document.getElementById('nowBox');
          box.classList.remove('flash');
          void box.offsetWidth;
          box.classList.add('flash');
          announce(t, d);
        }
      } else {
        document.getElementById('nowTicket').innerText = '---';
        document.getElementById('nowDept').innerText = 'Waiting for next patient call...';
        document.getElementById('nowName').innerText = 'Please hold your NFC Card or ticket ready';
      }

      // Up Next
      const nextEl = document.getElementById('upNextList');
      if (data.up_next && data.up_next.length) {
        nextEl.innerHTML = data.up_next.map(item => `
          <div class="up-item">
            <div>
              <div class="up-ticket">${item.ticket_number}</div>
              <div class="up-dept">${item.department}</div>
            </div>
            <span class="up-pay ${item.payment_status==='PAID'?'pay-paid':'pay-pending'}">
              ${item.payment_status==='PAID' ? '✅ PAID' : '⏳ PAY FIRST'}
            </span>
          </div>
        `).join('');
      } else {
        nextEl.innerHTML = '<p style="color:var(--muted);font-size:14px;margin-top:8px;">No patients currently waiting.</p>';
      }
    } catch(e) { console.error('TV poll error:', e); }
  }

  pollTV();
  setInterval(pollTV, 3000);
</script>
</body>
</html>
