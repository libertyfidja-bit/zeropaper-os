services:
  zeropaper-os:
    build: .
    container_name: zeropaper_hospital_os
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - TZ=Africa/Kigali
      - HOSPITAL_DB_PATH=/var/hospital_data/hospital_local_server.db
      - HOSPITAL_BACKUP_DIR=/mnt/hospital_backups
      - ZEROPAPER_LICENSE_KEY=${ZEROPAPER_LICENSE_KEY:-}
    volumes:
      # Mounts the live database to the hospital's local primary disk
      - ./hospital_server_db:/var/hospital_data
      # Mounts the daily 6:00 PM auto-backups to the hospital's secondary drive / NAS mount
      - ./hospital_daily_backups:/mnt/hospital_backups
